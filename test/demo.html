<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Quick Text 测试页</title>
  <style>
    body {
      font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 720px; margin: 0 auto; padding: 24px 16px; color: #1f2328;
    }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin: 0 0 8px; color: #4f6bed; }
    section { margin: 20px 0; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 10px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit;
    }
    [contenteditable] {
      min-height: 72px; padding: 8px 10px; border: 1px dashed #aaa; border-radius: 6px;
    }
    [contenteditable]:focus, input:focus, textarea:focus { outline: 2px solid #4f6bed55; }
    kbd {
      padding: 1px 6px; border: 1px solid #ccc; border-bottom-width: 2px;
      border-radius: 4px; background: #f6f6f6; font-family: inherit;
    }
    iframe { width: 100%; height: 200px; border: 1px solid #ccc; border-radius: 6px; }
    .spacer { height: 60vh; display: flex; align-items: center; color: #999; }
  </style>
</head>
<body>
  <h1>Quick Text 测试页</h1>
  <p>把光标放进下面任意输入框,按 <kbd>Alt+Q</kbd>(或点工具栏图标 / 右键菜单)测试面板与插入。</p>

  <section>
    <h2>1. 单行 input</h2>
    <input type="text" placeholder="单行输入框:多行片段插入时换行应变空格">
  </section>

  <section>
    <h2>2. textarea</h2>
    <textarea rows="5" placeholder="多行文本框:测试多行片段、Ctrl+Z 撤销、面板跟随光标"></textarea>
  </section>

  <section>
    <h2>3. contenteditable 富文本</h2>
    <div contenteditable="true"><p>在这里点一下放置光标,可以<b>带格式</b>插入。试试把光标放到这行文字中间。</p></div>
  </section>

  <section>
    <h2>4. 密码框(应被排除)</h2>
    <input type="password" placeholder="焦点在这里按 Alt+Q,不应写入密码框(进复制模式)">
  </section>

  <section>
    <h2>5. iframe 内的输入框</h2>
    <iframe src="demo-frame.html" title="iframe 测试"></iframe>
  </section>

  <div class="spacer">↓ 往下滚动,测试视口底部的面板向上翻转 ↓</div>

  <section>
    <h2>6. 视口底部输入框</h2>
    <input type="text" placeholder="光标放这里按 Alt+Q,面板应向上弹出">
  </section>
</body>
</html>
